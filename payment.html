<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; font-src https://cdn.jsdelivr.net data:; connect-src 'self' https://gateway.zibal.ir https://api.telegram.org; base-uri 'self'; object-src 'none'">
<title>نتیجه پرداخت | استار شاپ</title>
<meta name="description" content="نتیجه و رسید پرداخت آنلاین درگاه زیبال — استار شاپ">

<style>
/* ═══ STARSHOP — Payment result (Zibal) ═══ */
:root{
  --bg:#05070b; --surface:#0b111c; --surface2:#101828;
  --ink:#f2f5fb; --muted:#8b93a7; --line:rgba(255,255,255,.09);
  --brand:#1557d6; --brand-light:#4e8cff; --accent:#00a6a6;
  --ok:#12b76a; --bad:#f04438;
  --radius:22px;
  --font:"Vazirmatn",Vazirmatn,Tahoma,"Segoe UI",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;background:
    radial-gradient(900px 480px at 85% -10%,rgba(21,87,214,.22),transparent 60%),
    radial-gradient(700px 420px at 0% 110%,rgba(0,166,166,.14),transparent 55%),
    var(--bg);
  color:var(--ink);font-family:var(--font);font-size:15.5px;line-height:1.9;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;
}
.pz-page{width:min(680px,100%);margin-inline:auto;padding:22px clamp(16px,4vw,32px) 34px;display:flex;flex-direction:column;flex:1}
.pz-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:6px 0 26px}
.pz-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;color:var(--ink);text-decoration:none}
.pz-brand svg{width:34px;height:34px;flex:none}
.pz-brand small{font-weight:600;font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.pz-langs{display:flex;gap:6px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:999px;padding:4px}
.pz-langs button{font-family:inherit;font-size:12px;font-weight:700;color:var(--muted);background:none;border:0;border-radius:999px;padding:5px 12px;cursor:pointer;transition:.25s}
.pz-langs button.on{background:var(--brand);color:#fff}
.pz-main{flex:1;display:flex;flex-direction:column;justify-content:center}
.pz-card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015)),var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(22px,4.5vw,38px);box-shadow:0 40px 90px -40px rgba(0,0,0,.65)}
.pz-spin{display:flex;flex-direction:column;align-items:center;gap:16px;padding:34px 0 22px;color:var(--muted);font-size:14px}
.pz-spin[hidden]{display:none}
.pz-spinner{width:44px;height:44px;border-radius:50%;border:3px solid rgba(78,140,255,.18);border-top-color:var(--brand-light);animation:pzr 1s linear infinite}
@keyframes pzr{to{transform:rotate(360deg)}}
.pz-state{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.pz-badge{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin-bottom:8px}
.pz-badge svg{width:32px;height:32px}
.pz-badge.ok{background:rgba(18,183,106,.14);border:1.5px solid rgba(18,183,106,.45);color:var(--ok);box-shadow:0 18px 44px -18px rgba(18,183,106,.5)}
.pz-badge.bad{background:rgba(240,68,56,.12);border:1.5px solid rgba(240,68,56,.42);color:var(--bad);box-shadow:0 18px 44px -18px rgba(240,68,56,.45)}
.pz-badge.info{background:rgba(78,140,255,.12);border:1.5px solid rgba(78,140,255,.4);color:var(--brand-light)}
.pz-state h1{margin:0;font-size:20px;font-weight:800}
.pz-state p{margin:0;font-size:13.5px;color:var(--muted);max-width:460px}
.pz-amount{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px;padding:16px 18px;border-radius:16px;background:linear-gradient(135deg,rgba(21,87,214,.2),rgba(0,166,166,.12));border:1px solid rgba(78,140,255,.28)}
.pz-amount span{font-size:13px;color:var(--muted)}
.pz-amount b{font-size:21px;font-weight:800;white-space:nowrap}
.pz-rows{margin-top:14px;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.pz-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 16px;font-size:13.5px;color:var(--muted);border-bottom:1px solid var(--line)}
.pz-row:last-child{border-bottom:0}
.pz-row b{color:var(--ink);font-weight:700;font-size:13.5px;text-align:left;word-break:break-word}
.pz-sec{margin-top:16px}
.pz-sec h4{margin:0 0 9px;font-size:13px;color:var(--muted);font-weight:700}
.pz-items{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.pz-items li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;font-size:13.5px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.02)}
.pz-items li:last-child{border-bottom:0}
.pz-items b{color:var(--brand-light);flex:none;font-weight:700}
.pz-st{margin:10px 0 0;text-align:center;font-size:12.5px;color:var(--bad)}
.pz-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.pz-actions a,.pz-actions button{display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;font-size:14px;font-weight:700;border-radius:14px;padding:12px 16px;cursor:pointer;text-decoration:none;border:0;transition:.25s}
.pz-actions .primary{background:linear-gradient(135deg,#2b34d4,#0000b8);color:#fff;box-shadow:0 14px 32px -14px rgba(0,0,184,.65)}
.pz-actions .primary:hover{filter:brightness(1.1)}
.pz-actions .ghost{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink)}
.pz-actions .ghost:hover{border-color:var(--brand-light)}
.pz-fine{margin:18px 4px 0;font-size:11.5px;color:var(--muted);text-align:center;line-height:2}
.pz-foot{padding:20px 0 6px;text-align:center;font-size:11.5px;color:var(--muted)}
.pz-foot bdi{color:rgba(255,255,255,.35)}
@media (max-width:480px){
  .pz-actions{grid-template-columns:1fr}
  .pz-amount b{font-size:18px}
  .pz-brand small{display:none}
}
</style>
</head>
<body>
<div class="pz-page">
  <header class="pz-head">
    <a class="pz-brand" href="./">
      <svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="pzg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4e8cff"/><stop offset="1" stop-color="#00a6a6"/></linearGradient></defs><path fill="url(#pzg)" d="M12 1.8l3 6.4 7 .9-5.2 4.8 1.4 6.9L12 17.3l-6.2 3.5 1.4-6.9L2 9.1l7-.9z"/></svg>
      <span>استار شاپ <small>Star Shop</small></span>
    </a>
    <div class="pz-langs" role="group" aria-label="language">
      <button type="button" data-pz-lang="fa" class="on">فا</button>
      <button type="button" data-pz-lang="en">EN</button>
      <button type="button" data-pz-lang="ar">ع</button>
    </div>
  </header>

  <main class="pz-main">
    <div class="pz-card">
      <div class="pz-spin" id="pzSpin">
        <span class="pz-spinner" aria-hidden="true"></span>
        <span data-i18n="pz.checking">در حال بررسی پرداخت…</span>
      </div>
      <div id="pzBody"></div>
    </div>
    <p class="pz-fine" data-i18n="pz.fine">تراکنش شما مستقیماً توسط درگاه امن زیبال بررسی و تأیید می‌شود؛ اطلاعات کارت بانکی نزد استار شاپ ذخیره نمی‌شود.</p>
  </main>

  <footer class="pz-foot">© <span data-i18n="pz.brand">استار شاپ</span> — <bdi dir="ltr">gateway.zibal.ir</bdi></footer>
</div>

<script src="assets/js/config.js?v=20260935"></script>
<script src="assets/js/data-fa.js?v=20260935"></script>
<script src="assets/js/data-en.js?v=20260935"></script>
<script src="assets/js/data-ar.js?v=20260935"></script>
<script src="assets/js/i18n.js?v=20260935"></script>
<script src="assets/js/notify.js?v=20260935"></script>
<script src="assets/js/cart.js?v=20260935"></script>
<script src="assets/js/payment.js?v=20260935"></script>
</body>
</html>
